# Definiciones del estudiante, configurables.
horizonte_dias: 14
dia_corte: 0                   # 0 = lunes
cobertura:                     # días del pedido, contados desde el corte
  desde_dia: 2
  hasta_dia: 8
niveles_cuantil: [0.1, 0.5, 0.9]
minimo_residuos_grupo: 30

validacion:
  ultimo_corte: "2017-03-13"
  cortes: 8
  paso_semanas: 4
  cortes_calibracion: 8

entrenamiento:
  primer_corte: "2015-01-05"
  paso_semanas: 2

semilla: 42
hilos: 4
limite_memoria_mb: 2800

vigente_inicial: baseline

reemplazo:
  mejora_costo_minima: 0.03    # costo de negocio al menos 3 % menor
  tolerancia_wape: 0.01        # WAPE no peor en más de 1 %
  cortes_ganados_minimo: 6     # menor costo en al menos 6 de 8 cortes
  cobertura_intervalo: [0.72, 0.88]
  tolerancia_q: 0.05           # cobertura de Q* a ±5 puntos

candidatos:
  lightgbm:
    tipo: lightgbm
    objetivo: log
    parametros: {learning_rate: 0.08, n_estimators: 200, num_leaves: 31, max_depth: 8, min_child_samples: 50, max_bin: 63, reg_lambda: 1.0}
  lightgbm_poisson:
    tipo: lightgbm
    objetivo: poisson
    parametros: {learning_rate: 0.08, n_estimators: 200, num_leaves: 31, max_depth: 8, min_child_samples: 50, max_bin: 63, reg_lambda: 1.0}
  hgb_poisson:
    tipo: hgb
    objetivo: poisson
    parametros: {learning_rate: 0.08, max_iter: 200, max_leaf_nodes: 31, max_depth: 8, min_samples_leaf: 50, max_bins: 64, l2_regularization: 1.0}
