# Airflow 3 con LocalExecutor. Los secretos se generan localmente en .env (make setup).
name: lab1-pronostico
x-airflow-common:
  &airflow-common
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  image: lab1-pronostico:3.3.2
  env_file:
    - ../.env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: 4
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_FOLDER: /opt/lab1/dags
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: 10
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: 10
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    PYTHONPATH: /opt/lab1/src
    OMP_NUM_THREADS: "4"
    REMOTO_MONTADO: /opt/dvc-storage/lab1
    GIT_AUTHOR_NAME: lab1-airflow
    GIT_AUTHOR_EMAIL: lab1@example.invalid
    GIT_COMMITTER_NAME: lab1-airflow
    GIT_COMMITTER_EMAIL: lab1@example.invalid
  volumes:
    - ./logs:/opt/airflow/logs
    - ..:/opt/lab1
    - ${BANDEJA_HOST:-../data/bandeja}:/opt/lab1/data/bandeja:ro
    - ../../dvc-storage/lab1:/opt/dvc-storage/lab1
  user: "${AIRFLOW_UID}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        if [ "$${AIRFLOW_UID}" != "$$(stat -c %u /opt/lab1)" ]; then
          echo "AIRFLOW_UID no coincide con el dueño del repositorio. Ejecuta: make setup" >&2
          exit 1
        fi
        mkdir -p /opt/airflow/logs
        chown -R "$${AIRFLOW_UID}:0" /opt/airflow/logs /opt/dvc-storage/lab1
        if [ -z "$$(ls -A /opt/dvc-storage/lab1)" ]; then
          touch /opt/dvc-storage/lab1/.remoto-lab1
          chown "$${AIRFLOW_UID}:0" /opt/dvc-storage/lab1/.remoto-lab1
        fi
        /entrypoint airflow version
        /entrypoint airflow pools set pesado 1 "tareas pesadas serializadas"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: airflow
    user: "0:0"

  simulador:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        if [ -n "$${BANDEJA_HOST:-}" ]; then
          echo "Bandeja externa: solo se genera la carga histórica"
          exec /entrypoint python -m pronostico_ventas.simulador --solo-historico
        fi
        /entrypoint python -m pronostico_ventas.simulador
    volumes:
      - ./logs:/opt/airflow/logs
      - ..:/opt/lab1
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    depends_on:
      <<: *airflow-common-depends-on
      simulador:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-common-depends-on
      simulador:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-common-depends-on
      simulador:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy

volumes:
  postgres-db-volume:
